name: Validate library and tools
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm run check
      # the committed build/ and build_node/ must match the sources (npm run build, then commit)
      - run: git diff --exit-code --stat -- build build_node
